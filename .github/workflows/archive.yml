name: Rebuild old beta

# Reconstruit une ancienne version (commit donné) sous le nom « FluxerHooks-beta-0.0.<N> »
# et la publie dans sa propre release (tag « mobile-b0.0.<N> »).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit de la version
        required: true
      beta:
        description: Numéro de beta
        required: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      N: ${{ inputs.beta }}
    steps:
      - name: Outils de build actuels
        uses: actions/checkout@v5
        with:
          path: ci

      - name: Code de la version
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          path: app

      - name: Scripts manquants et nommage beta
        run: |
          mkdir -p app/scripts
          for f in enable-abi-splits.js use-release-signing.js; do [ -f app/scripts/$f ] || cp ci/scripts/$f app/scripts/; done
          node ci/scripts/beta-label.js "$N" app

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Installer, générer le projet natif
        working-directory: app
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          node scripts/enable-abi-splits.js

      - name: Configurer la signature
        if: env.HAS_KEYSTORE == 'true'
        working-directory: app
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > android/app/release.keystore
          cat >> android/gradle.properties <<PROPS
          FLUXERHOOKS_STORE_FILE=release.keystore
          FLUXERHOOKS_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLUXERHOOKS_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          FLUXERHOOKS_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
          node scripts/use-release-signing.js

      - name: Compiler l'APK (release)
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

      - name: Renommer, vérifier, publier
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee /tmp/pub.log) 2>&1
          set -x
          mkdir -p dist
          OUT=android/app/build/outputs/apk/release
          cp $OUT/app-arm64-v8a-release.apk   "dist/FluxerHooks-beta-0.0.$N-arm64.apk"
          cp $OUT/app-armeabi-v7a-release.apk "dist/FluxerHooks-beta-0.0.$N-armv7.apk"
          cp $OUT/app-universal-release.apk   "dist/FluxerHooks-beta-0.0.$N-universel.apk"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for f in dist/*.apk; do $BT/apksigner verify "$f"; done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            node "$GITHUB_WORKSPACE/ci/scripts/release-notes.js" "$N" "$GITHUB_WORKSPACE/ci/CHANGELOG.md" || echo "_Pas d'entrée dans CHANGELOG.md pour beta$N._"
          } > /tmp/notes.md
          gh release delete "mobile-b0.0.$N" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "mobile-b0.0.$N" dist/* -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "FluxerHooks-beta-0.0.$N" --notes-file /tmp/notes.md

      - name: Journal d'échec
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp /tmp/pub.log /tmp/logs/ 2>/dev/null || echo "pas de journal" > /tmp/logs/pub.log
          cd /tmp/logs && git init -q && git checkout -q -b ci-logs-beta
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -q -m "Journal ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs-beta
