name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Le SDK Android est préinstallé sur les machines ubuntu de GitHub ($ANDROID_HOME).
      - name: Vérifier le SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > /dev/null

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le TypeScript
        run: npx tsc --noEmit

      - name: Générer le projet Android natif
        run: npx expo prebuild --platform android --no-install

      - name: Un APK par architecture
        run: node scripts/enable-abi-splits.js

      # Signature : si les secrets ANDROID_KEYSTORE_* sont définis, l'APK est signé avec ta clé ;
      # sinon il est signé avec la clé de debug (installable, mais pas publiable sur le Play Store).
      - name: Configurer la signature
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > android/app/release.keystore
          cat >> android/gradle.properties <<PROPS
          FLUXERHOOKS_STORE_FILE=release.keystore
          FLUXERHOOKS_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLUXERHOOKS_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          FLUXERHOOKS_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
          node scripts/use-release-signing.js

      - name: Compiler l'APK (release)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 2>&1 | tee ../gradle.log

      - name: Renommer et vérifier
        run: |
          mkdir -p dist
          V=$(node -p "require('./app.json').expo.version")
          OUT=android/app/build/outputs/apk/release
          ls -la $OUT
          cp $OUT/app-arm64-v8a-release.apk   "dist/FluxerHooks-$V-arm64.apk"
          cp $OUT/app-armeabi-v7a-release.apk "dist/FluxerHooks-$V-armv7.apk"
          cp $OUT/app-universal-release.apk   "dist/FluxerHooks-$V-universel.apk"
          # Contrôle d'intégrité : signature vérifiée + sommes SHA-256 publiées avec les APK.
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for f in dist/*.apk; do $BT/apksigner verify "$f" && echo "OK $f"; done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v5
        with:
          name: FluxerHooks-apk
          path: dist/*

      - name: Publier une release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      # Dernier APK de main, toujours disponible au même endroit.
      - name: Publier la pré-release « latest »
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/* --prerelease --title "FluxerHooks-$(node -p "require('./app.json').expo.version") (dernier build)" --notes "APK généré depuis ${GITHUB_SHA::7}. Prends **-arm64** pour la plupart des téléphones (plus léger), **-armv7** pour les anciens, **-universel** en cas de doute." --target "$GITHUB_SHA"

      # En cas d'échec, le journal est publié sur la branche ci-logs pour diagnostic.
      - name: Publier le journal d'échec
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp gradle.log /tmp/logs/ 2>/dev/null || echo "pas de gradle.log" > /tmp/logs/gradle.log
          tail -n 300 /tmp/logs/gradle.log > /tmp/logs/tail.log
          cd /tmp/logs && git init -q && git checkout -q -b ci-logs
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -q -m "Journal du run ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
