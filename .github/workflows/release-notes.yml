name: Sync release notes

# Réécrit la description de chaque release « mobile-b0.0.<N> » à partir de CHANGELOG.md (audit log).
# Se lance à la main (Actions → Sync release notes → Run workflow) ou quand CHANGELOG.md change.
# La release « mobile-latest » est régénérée par « Build Android APK » à chaque push sur la branche mobile.
on:
  workflow_dispatch:
  push:
    branches: [mobile]
    paths: [CHANGELOG.md, scripts/release-notes.js]

jobs:
  notes:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Mettre à jour les descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for N in $(grep -oE '^## beta-0\.0\.[0-9]+' CHANGELOG.md | grep -oE '[0-9]+$'); do
            T="mobile-b0.0.$N"
            if ! gh release view "$T" >/dev/null 2>&1; then echo "$T : pas de release, ignorée"; continue; fi
            node scripts/release-notes.js "$N" > "/tmp/notes-$N.md"
            gh release edit "$T" --notes-file "/tmp/notes-$N.md"
            echo "$T : description mise à jour"
          done
