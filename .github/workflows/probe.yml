name: Sonde API Fluxer
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml', 'scripts/probe-login.mts']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Connexion complète avec CAPTCHA (identifiants factices)
        run: mkdir -p out && npx --yes tsx scripts/probe-login.mts || true
      - name: Publier
        run: |
          cd out && git init -q && git checkout -q -b ci-logs
          git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -q -m probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
