plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.fluxerhooks'
version = '1.0.0'

android {
  namespace "app.fluxerhooks.gateway"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Même OkHttp que React Native (WebSocket du gateway).
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
